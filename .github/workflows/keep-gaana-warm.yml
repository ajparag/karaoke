# =============================================================================
# .github/workflows/keep-gaana-warm.yml
# =============================================================================
# Pings the Gaana search service on Render every 10 minutes to prevent
# Render's free-tier from spinning it down after 15 minutes of inactivity.
#
# WHY 10 MINUTES: Render's free tier spins down after ~15 min with no
# incoming requests. Pinging every 10 min means it never goes 15 minutes
# without traffic, so the service never idles down in the first place.
#
# WHY THIS WORKS WITHOUT A DEDICATED HEALTH ENDPOINT: Render's idle timer
# resets on ANY incoming HTTP request, regardless of the response status
# code. A 404 from the root path still counts as "activity" — we don't
# need to know Gaana's exact route structure for this to work.
#
# KNOWN LIMITATION, stated honestly: GitHub Actions' schedule trigger is
# NOT guaranteed to fire at the exact minute — under GitHub's own load,
# scheduled runs can occasionally slip by a few minutes. This is free and
# should fully solve the cold-start problem in practice, but isn't a
# 100% ironclad guarantee the way upgrading to Render's paid tier would
# be. If a cold start ever slips through despite this, that's the
# tradeoff -- upgrading Render's plan removes the spin-down mechanism
# entirely at the source instead of working around it.
# =============================================================================

name: Keep Gaana Service Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you manually trigger a ping from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Gaana service on Render
        run: |
          # --max-time 60: a cold start can take 30-50s to respond. We wait
          # long enough for the wake-up to actually complete rather than
          # timing out mid-boot and having to wait for the next cron tick.
          #
          # No --fail flag: any HTTP response (even 404) means the request
          # reached the server and reset its idle timer -- that IS success
          # for our purposes, regardless of what status code comes back.
          # We don't want GitHub emailing "workflow failed" every 10 minutes
          # just because Gaana's root path isn't a defined route.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            "https://gaanapy-2ta9.onrender.com/" || echo "no-response")

          echo "Gaana ping response: $STATUS"

          if [ "$STATUS" = "no-response" ]; then
            echo "::warning::No response at all from Gaana (connection-level failure) -- worth checking if the service is down, not just cold."
          else
            echo "Ping reached the server successfully (HTTP $STATUS) -- idle timer reset regardless of status code."
          fi
