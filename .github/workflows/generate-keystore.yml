# =============================================================================
# .github/workflows/generate-keystore.yml
# =============================================================================
# ONE-OFF workflow -- run this once to generate the release keystore on
# GitHub's servers, so nothing needs to be installed locally.
#
# HOW TO USE:
#   1. Add this file at .github/workflows/generate-keystore.yml and push it.
#   2. Go to your repo's Actions tab -> "Generate Release Keystore" ->
#      "Run workflow" button (top right) -> Run workflow.
#   3. Once it finishes, click into the run -> scroll to "Artifacts" ->
#      download "karaokeparty-keystore". It's a zip containing the
#      .keystore file.
#   4. Base64-encode it (still needed for the GitHub secret) -- see the
#      note at the bottom of this file for how to do that without any
#      local install either.
#   5. DELETE THIS WORKFLOW FILE after you're done -- it's a one-time
#      utility, not something that should stay in the repo generating
#      keystores on demand.
#
# You will be prompted (via workflow inputs below) for the same details
# keytool normally asks interactively -- name, org, etc. -- since GitHub
# Actions can't do interactive prompts.
# =============================================================================

name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'karaokeparty'
      store_password:
        description: 'Keystore password (remember this -- you will need it for GitHub Secrets)'
        required: true
      key_password:
        description: 'Key password (can be the same as keystore password)'
        required: true
      full_name:
        description: 'Your name (for the certificate)'
        required: true
        default: 'Parag Agarwal'
      org:
        description: 'Organisation (can be anything, e.g. your name again)'
        required: true
        default: 'KaraokeParty'
      city:
        description: 'City'
        required: true
        default: 'Mumbai'
      state:
        description: 'State'
        required: true
        default: 'Maharashtra'
      country_code:
        description: 'Two-letter country code'
        required: true
        default: 'IN'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore karaokeparty-release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=${{ inputs.full_name }}, O=${{ inputs.org }}, L=${{ inputs.city }}, ST=${{ inputs.state }}, C=${{ inputs.country_code }}"

      - name: Base64-encode the keystore
        run: base64 -w 0 karaokeparty-release.keystore > karaokeparty-release.keystore.b64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: karaokeparty-keystore
          path: |
            karaokeparty-release.keystore
            karaokeparty-release.keystore.b64
          retention-days: 7
